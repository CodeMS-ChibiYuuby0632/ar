<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body>
    <a-scene embedded arjs="sourceType: webcam">
        <a-assets>
            <img id="obj" src="assets/images/Tsur116217_TP_V4.jpg" alt="">
        </a-assets>
        <a-marker preset="hiro">
            <a-box scale="0.3 0.3 0.3" color="yellowgreen"></a-box>
            <a-box position="0.5 0 0.5" scale="0.3 0.3 0.3" color="red"></a-box>
            <a-box position="0 0 0.5" scale="0.3 0.3 0.3" color="brown"></a-box>
            <a-box position="-0.5 0 0.5" scale="0.3 0.3 0.3" color="darkred"></a-box>
            <a-box position="0.5 0 0" scale="0.3 0.3 0.3" color="yellow"></a-box>
            <a-box position="-0.5 0 0" scale="0.3 0.3 0.3" color="green"></a-box>
            <a-box position="0.5 0 -0.5" scale="0.3 0.3 0.3" color="skyblue"></a-box>
            <a-box position="0 0 -0.5" scale="0.3 0.3 0.3" color="blue"></a-box>
            <a-box position="-0.5 0 -0.5" scale="0.3 0.3 0.3" color="darkblue"></a-box>
        </a-marker>

        <a-marker preset="kanji">
            <a-sphere
                position="0 0 0"
                material="src:#obj"
                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    easing: linear;
                    dur: 20000;
                "
            ></a-sphere>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
