<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
</head>

<body>
    <a-scene
        physics="gravity: -50"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
    >
    <a-assets>
        <img id="mokume1" src="assets/images/N845_mokumetex_TP_V.jpg" alt="">
        <img id="mokume2" src="assets/images/mokume2.jpg" alt="">
        <img id="nuno1" src="assets/images/nuno1.jpg" alt="">
    </a-assets>
    <a-sky color="orange"></a-sky>
    <a-plane
        position="0 -10 -30.5"
        rotation="0 0 0"
        width="50"
        height="70"
        material="src:#mokume2"
        static-body
    ></a-plane>
    <a-plane
        position="0 -10 -27.5"
        rotation="0 180 0"
        width="50"
        height="70"
        material="src:#mokume2"
        static-body
    ></a-plane>
    <a-box
        position="-0.5 24.5 -29"
        scale="49 1 3"
        static-body
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="-21 20.5 -29"
        rotation="0 0 45"
        scale="10 1 3"
        static-body
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="0 -44.5 -29"
        scale="5 1 3"
        static-body
        class="target10"
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="7 -44.5 -29"
        scale="9 1 3"
        static-body
        class="target3"
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="-7 -44.5 -29"
        scale="9 1 3"
        static-body
        class="target3"
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="18 -44.5 -29"
        scale="12 1 3"
        static-body
        class="target1"
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="-18 -44.5 -29"
        scale="12 1 3"
        static-body
        class="target1"
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="-24.5 -10 -29"
        scale="1 68 3"
        static-body
        material="src:#mokume1"
    ></a-box>
    <a-box
        position="34.0 -10 -29"
        scale="20 70 3"
        static-body
        material="src:#mokume1"
    ></a-box>
    <a-cylinder
        position="23 22 -29"
        rotation="0 0 90"
        scale="2 2 2"
        material="src:#nuno1"
    ></a-cylinder>

    <a-box
        position="-12 -35 -29"
        scale="1 20 3"
        material="src:#mokume1"
        static-body
    ></a-box>
    <a-box
        position="-3 -35 -29"
        scale="1 20 3"
        material="src:#mokume1"
        static-body
    ></a-box>
    <a-box
        position="3 -35 -29"
        scale="1 20 3"
        material="src:#mokume1"
        static-body
    ></a-box>
    <a-box
        position="12 -35 -29"
        scale="1 20 3"
        material="src:#mokume1"
        static-body
    ></a-box>
    <a-plane
        position="-18 -34 -29"
        scale="11 19 1"
        opacity="0.5"
        color="blue"
    ></a-plane>
    <a-text
        position="-18 -34 -28"
        value="1"
        color="black"
        align="center"
        scale="20 20 20"
    ></a-text>
    <a-plane
        position="18 -34 -29"
        scale="11 19 1"
        opacity="0.5"
        color="blue"
    ></a-plane>
    <a-text
        position="17 -34 -28"
        value="1"
        color="black"
        align="center"
        scale="20 20 20"
    ></a-text>
    <a-plane
        position="7.5 -34 -29"
        scale="8 19 1"
        opacity="0.5"
        color="yellow"
    ></a-plane>
    <a-text
        position="7.5 -34 -28"
        value="3"
        color="black"
        align="center"
        scale="20 20 20"
    ></a-text>
    <a-plane
        position="-7.5 -34 -29"
        scale="8 19 1"
        opacity="0.5"
        color="yellow"
    ></a-plane>
    <a-text
        position="-7.5 -34 -28"
        value="3"
        color="black"
        align="center"
        scale="20 20 20"
    ></a-text>
    <a-plane
        position="0 -34 -29"
        scale="5 19 1"
        opacity="0.5"
        color="red"
    ></a-plane>
    <a-text
        position="0 -34 -28"
        value="10"
        color="black"
        align="center"
        scale="20 20 20"
    ></a-text>

    <a-box
        position="12 10 -29"
        scale="30 1 3"
        material="src:#mokume1"
        static-body
        animation="
            property: position;
            to: -10 10 -29;
            easing: easeInOutSine;
            loop: true;
            dir: alternate;
            dur: 3000;
        "
    ></a-box>
    <a-box
        position="15 0 -29"
        scale="15 1 3"
        material="src:#mokume1"
        static-body
        animation="
            property: position;
            to: 5 0 -29;
            easing: easeInOutSine;
            loop: true;
            dir: alternate;
            dur: 1500;
        "
    ></a-box>
    <a-box
        position="-5 0 -29"
        scale="15 1 3"
        material="src:#mokume1"
        static-body
        animation="
            property: position;
            to: -15 0 -29;
            easing: easeInOutSine;
            loop: true;
            dir: alternate;
            dur: 1500;
        "
    ></a-box>
    <a-box
        position="-15 -13 -29"
        scale="15 1 3"
        material="src:#mokume1"
        static-body
        animation="
            property: rotation;
            to: 0 0 -360;
            loop: true;
            easing: linear;
        "
    ></a-box>
    <a-box
        position="15 -13 -29"
        scale="15 1 3"
        material="src:#mokume1"
        static-body
        animation="
            property: rotation;
            to: 0 0 360;
            loop: true;
            easing: linear;
        "
    ></a-box>
    <!-- static-body="shape~ AI使用 -->
    <a-cylinder
        position="0 -10 -29"
        rotation="90 0 0"
        scale="3 3 3"
        material="src:#mokume1"
        static-body="shape: cylinder; cylinderAxis: y;"
    ></a-cylinder>

    <a-plane
        position="33 3 -27"
        scale="13 10 1"
    ></a-plane>
    <a-text
        position="26 3 -26.5"
        value="0"
        color="black"
        scale="30 30 30"
        id="scoreDisplay"
    ></a-text>
    <a-plane
        position="33 16 -27"
        scale="13 10 1"
    ></a-plane>
    <a-text
        position="26 16 -26.5"
        value="0"
        color="black"
        scale="30 30 30"
        id="countDisplay"
    ></a-text>
    <a-plane
        position="33 -17 -27"
        scale="10 6 1"
        id="launchButton"
        class="clickable"
    ></a-plane>
    <a-text
    position="29 -17 -26.5"
    value="Launch"
    color="black"
    scale="10 10 10"
    ></a-text>
    <a-plane
    position="33 -25 -27"
    scale="10 6 1"
    id="resetButton"
    class="clickable"
    ></a-plane>
    <a-text
    position="29.5 -25 -26.5"
    value="Reset"
    color="black"
    scale="10 10 10"
    ></a-text>
    
    <a-sphere
        position="-23 22 -29"
        width="0.5"
        height="0.5"
        dynamic-body
        id="ball"
        material="src:#nuno1"
    ></a-sphere>

    <a-camera
        position="10 -10 15"
    ></a-camera>
    </a-scene>

    <script>
        const ball = document.getElementById("ball");
        const launchButton = document.getElementById("launchButton");
        const resetButton = document.getElementById("resetButton");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const countDisplay = document.getElementById("countDisplay");

        let score = 0;
        let ballCount = 0;
        let targetHited = false;

        function shootBall(){
            if (ball.body) {
            // 1. 物理エンジンの位置を更新（AI使用）
            ball.body.position.set(22, 21.5, -29);
            
            // 2. 速度や回転の勢い（慣性）をリセットする（必要に応じて）（AI使用）
            ball.body.velocity.set(0, 0, 0);
            ball.body.angularVelocity.set(0, 0, 0);
            
            // 3. A-Frame側の位置も同期
            ball.setAttribute("position", "22 21.5 -29");
            } else {
            // 物理エンジンがまだ初期化されていない場合は通常通り
            ball.setAttribute("position", "22 21.5 -29");
            }
            ball.body.applyImpulse(
                new CANNON.Vec3(-200, 0, 0),
                // ▼ 【修正】第2引数に中心位置 (0, 0, 0) を追加する（AI使用）
                new CANNON.Vec3(0, 0, 0)
            );

            targetHited = false;
            ballCount++;
            countDisplay.setAttribute("value", ballCount);
        };

        function reset(){
            ballCount = 0;
            score = 0;
            scoreDisplay.setAttribute("value", 0);
            countDisplay.setAttribute("value", 0);

            if (ball.body) {
            // 1. 物理エンジンの位置を更新（AI使用）
            ball.body.position.set(-23, 22, -29);
            
            // 2. 速度や回転の勢い（慣性）をリセットする（必要に応じて）（AI使用）
            ball.body.velocity.set(0, 0, 0);
            ball.body.angularVelocity.set(0, 0, 0);
            
            // 3. A-Frame側の位置も同期
            ball.setAttribute("position", "-23 22 -29");
            } else {
            // 物理エンジンがまだ初期化されていない場合は通常通り
            ball.setAttribute("position", "-23 22 -29");
            }
        }
        
        function targetHit(event){
            const target = event.detail.body.el;

            if(target.classList.contains("target1") && !targetHited){
                score+=1;
                targetHited = true;
            }else if(target.classList.contains("target3") && !targetHited){
                score+=3;
                targetHited = true;
            }else if(target.classList.contains("target10") && !targetHited){
                score+=10;
                targetHited = true;
            };

            scoreDisplay.setAttribute("value", score);
        }

        launchButton.addEventListener("click", shootBall);
        resetButton.addEventListener("click", reset);
        ball.addEventListener("collide", targetHit);
    </script>
</body>

</html>
