<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
        }
        
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }
    </style>

</head>

<body>
    <div id="hud">
        <select id="colorSelect">
            <option value="cyan" selected>シアン</option>
            <option value="gold">ゴールド</option>
            <option value="rose">ローズ</option>
            <option value="violet">バイオレット</option>
        </select>
    </div>
    <a-scene hands>
        <!-- <a-entity hand-skeleton="
            points: true;
            lines: true;
            numbers: true;
            color: gold;
        "></a-entity> -->
        <!-- <a-entity hand-anchor="index: 8">
            <a-octahedron
                color="gold"
                scale="0.1 0.1 0.1"
                position="0 0.2 0"
            ></a-octahedron>
        </a-entity> -->
        <a-entity hand-anchor="index: 9">
            <a-gltf-model
                id="circle"
                src="../assets/models/magic_circle/c_cyan.glb"
                animation-mixer="clip: MagicCircle_Loop"
                position="0 1 0"
                scale="2 2 2"
            ></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const colorSelect = document.getElementById("colorSelect");
        const circle = document.getElementById("circle");

        const changeSound = new Audio("../assets/audio/changeMagic.mp3");
        
        function colorChange(){
            circle.setAttribute("src", `../assets/models/magic_circle/c_${colorSelect.value}.glb`)
            changeSound.play()
        }

        colorSelect.addEventListener("change", colorChange);
    </script>
</body>

</html>
